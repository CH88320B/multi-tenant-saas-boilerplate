openapi: 3.0.3
info:
  title: Multi-tenant SaaS API
  version: 1.0.0
  description: Tenant-isolated API with roles (superadmin, admin, user), Stripe billing and per-tenant rate limits.
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
security: [{ bearer: [] }]
paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      security: []
      summary: Create a tenant and its first admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [company, slug, name, email, password]
              properties:
                company: { type: string }
                slug: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses: { '201': { description: Created }, '409': { description: Slug or email taken } }
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Get a JWT
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { email: { type: string }, password: { type: string } } }
      responses: { '200': { description: OK }, '401': { description: Invalid credentials } }
  /api/auth/me:
    get: { tags: [Auth], summary: Current user and tenant, responses: { '200': { description: OK } } }
  /api/users:
    get: { tags: [Users], summary: List users in my tenant, responses: { '200': { description: OK } } }
    post:
      tags: [Users]
      summary: Invite a user (admin; subject to plan seat limit)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { email: { type: string }, name: { type: string }, role: { type: string, enum: [admin, user] } } }
      responses: { '201': { description: Invited }, '402': { description: Seat limit reached }, '403': { description: Not an admin } }
  /api/users/{id}/role:
    patch:
      tags: [Users]
      summary: Change a user's role (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated } }
  /api/users/{id}:
    delete:
      tags: [Users]
      summary: Remove a user (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Removed } }
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects (tenant-scoped)
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
    post:
      tags: [Projects]
      summary: Create a project
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, description: { type: string } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
  /api/projects/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Projects], summary: Get a project, responses: { '200': { description: OK }, '404': { description: Not found (or other tenant) } } }
    delete: { tags: [Projects], summary: Delete a project (admin), responses: { '204': { description: Deleted } } }
  /api/billing/checkout:
    post:
      tags: [Billing]
      summary: Start a Stripe subscription checkout (admin)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { plan: { type: string, enum: [pro, enterprise] } } }
      responses: { '201': { description: Checkout URL } }
  /api/billing/portal:
    post: { tags: [Billing], summary: Stripe customer portal link (admin), responses: { '200': { description: Portal URL } } }
  /api/billing/webhook:
    post: { tags: [Billing], security: [], summary: Stripe webhook (signature verified), responses: { '200': { description: Received } } }
  /api/admin/tenants:
    get: { tags: [Platform], summary: All tenants with usage (superadmin), responses: { '200': { description: OK } } }
  /api/admin/tenants/{id}/plan:
    patch:
      tags: [Platform]
      summary: Override a tenant plan (superadmin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated } }
